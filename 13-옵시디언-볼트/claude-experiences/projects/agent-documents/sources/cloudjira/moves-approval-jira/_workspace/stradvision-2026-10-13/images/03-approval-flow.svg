<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#FFFFFF"/><text x="28" y="34" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#10201E">사용자×월 단위로 제출하고 팀장이 결재한다 — 결정이 진실, 상태는 파생</text><rect x="40" y="70" width="230" height="90" rx="8" fill="#F4F8F7" stroke="#D9E4E2" stroke-width="1.2"/><text x="56" y="96" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="56" dy="0">1. 기간 워크로그</tspan></text><text x="56" y="118" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="56" dy="0">periodKey = 2026-10 (정책 approvalUnit)</tspan><tspan x="56" dy="15.75">scopeKey TIMESHEET:{accountId}:{period}</tspan></text><rect x="320" y="70" width="230" height="90" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="336" y="96" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="336" dy="0">2. 제출(SUBMITTED)</tspan></text><text x="336" y="118" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="336" dy="0">워크로그 묶음 스냅샷 고정</tspan><tspan x="336" dy="15.75">id·초·시작일·이슈 → contentHash</tspan></text><rect x="600" y="70" width="230" height="90" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="616" y="96" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="616" dy="0">3. 팀장 결재(PENDING)</tspan></text><text x="616" y="118" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="616" dy="0">팀 × 기간 매트릭스</tspan><tspan x="616" dy="15.75">decideTimesheets 최대 50건 · PIN 1회</tspan></text><rect x="880" y="70" width="280" height="90" rx="8" fill="#E6F4EC" stroke="#2E9E6B" stroke-width="1.2"/><text x="896" y="96" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="896" dy="0">4. APPROVED</tspan></text><text x="896" y="118" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="896" dy="0">approval_approver 행 = 결정의 원천</tspan><tspan x="896" dy="15.75">approval_event(결정적 id) · 서명/PIN · 증명서</tspan></text><defs><marker id="m7wfrla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M270 115 L320 115" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#m7wfrla)"/><defs><marker id="mckh9ho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M550 115 L600 115" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#mckh9ho)"/><defs><marker id="mb6a4nu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M830 115 L880 115" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#mb6a4nu)"/><rect x="842.4" y="85" width="25.2" height="20" rx="4" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2"/><text x="855" y="99" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="middle"><tspan x="855" dy="0">승인</tspan></text><rect x="600" y="220" width="230" height="70" rx="8" fill="#FBE9E9" stroke="#D64545" stroke-width="1.2"/><text x="616" y="246" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor=