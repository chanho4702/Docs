Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#14756E" text-anchor="start"><tspan x="56" dy="0">기간 마감 · 재개방 (관리자)</tspan></text><rect x="60" y="400" width="330" height="150" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="76" y="426" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="76" dy="0">closePeriod → CLOSED</tspan></text><text x="76" y="448" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="76" dy="0">우리 화면 입력 거부(PERIOD_CLOSED)</tspan><tspan x="76" dy="15.75">자동 마감 timesheetAutoCloseDays(기본 꺼짐)</tspan><tspan x="76" dy="15.75">마감 후 다른 경로 변경은 timesheet_close_drift 표시</tspan></text><rect x="420" y="400" width="340" height="150" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="436" y="426" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="436" dy="0">reopenPeriod · 두 단계</tspan></text><text x="436" y="448" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="436" dy="0">(a) 새 입력 허용 — 마감 잠금만 해제</tspan><tspan x="436" dy="15.75">(b) 수정까지 허용 — 승인·인증 해제 + 숨김 해제</tspan><tspan x="436" dy="15.75">    + 재승인·재인증 필요, 사유 필수, 감사 기록</tspan></text><rect x="790" y="400" width="350" height="150" rx="8" fill="#F4F8F7" stroke="#D9E4E2" stroke-width="1.2"/><text x="806" y="426" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="806" dy="0">결재 공통 기능(Confluence 판 이식)</tspan></text><text x="806" y="448" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="806" dy="0">위임 · 참조(CC) · 결재 그룹 · 독촉(기본 OFF)</tspan><tspan x="806" dy="15.75">서명/PIN · 앱 내 알림함 · 업무함 범용 bulkApprove</tspan><tspan x="806" dy="15.75">증명서 PDF(getApprovalCertificate)</tspan></text><defs><marker id="mx13c8y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M390 475 L420 475" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#mx13c8y)"/></svg>