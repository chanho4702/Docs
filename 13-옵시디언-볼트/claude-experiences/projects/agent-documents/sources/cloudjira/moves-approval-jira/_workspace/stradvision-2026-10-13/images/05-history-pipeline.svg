<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><rect width="1200" height="540" fill="#FFFFFF"/><text x="28" y="34" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#10201E">워크로그 변경은 이벤트로 받아 미러·이력에 쌓고, 만료분은 내보낸 뒤에만 지운다</text><rect x="40" y="80" width="250" height="100" rx="8" fill="#F4F8F7" stroke="#D9E4E2" stroke-width="1.2"/><text x="56" y="106" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="56" dy="0">수집</tspan></text><text x="56" y="128" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="56" dy="0">avi:jira:created:worklog</tspan><tspan x="56" dy="15.75">avi:jira:updated:worklog</tspan><tspan x="56" dy="15.75">avi:jira:deleted:worklog</tspan></text><rect x="40" y="210" width="250" height="90" rx="8" fill="#F4F8F7" stroke="#D9E4E2" stroke-width="1.2"/><text x="56" y="236" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="56" dy="0">보정 (일일 스윕)</tspan></text><text x="56" y="258" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="56" dy="0">/rest/api/3/worklog/updated?since</tspan><tspan x="56" dy="15.75">/rest/api/3/worklog/deleted?since</tspan><tspan x="56" dy="15.75">놓친 이벤트 흡수</tspan></text><rect x="340" y="80" width="300" height="220" rx="8" fill="#E9F7F4" stroke="#21ADAD" stroke-width="1.2"/><text x="356" y="106" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="356" dy="0">worklog_mirror + worklog_history</tspan></text><text x="356" y="128" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="356" dy="0">미러: 마지막 관측값(CAS rev=rev+1)</tspan><tspan x="356" dy="15.75">이력 PK (worklog_id, seq) 결정적 — 중복 없음</tspan><tspan x="356" dy="15.75">생성·수정·삭제 전/후 값 · 행위자 · 출처(APP/JIRA/SWEEP)</tspan><tspan x="356" dy="15.75">워크포스 연결 여부(wf_linked)</tspan><tspan x="356" dy="15.75">설명은 지문 + 앞 40자(원문 보관 옵션)</tspan><tspan x="356" dy="15.75">삭제 이벤트에 본문이 없어도 미러에서 복원</tspan></text><defs><marker id="myawu0v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M290 130 L340 130" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#myawu0v)"/><defs><marker id="mjc8m0k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M290 255 L340 255" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#mjc8m0k)"/><rect x="690" y="80" width="230" height="100" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="706" y="106" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="706" dy="0">감사 화면</tspan></text><text x="706" y="128" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="706" dy="0">설정 &gt; 기록 &gt; 감사</tspan><tspan x="706" dy="15.75">결재·인증·워크로그 변경·설정 변경 탭</tspan><tspan x="706" dy="15.75">엑셀 내보내기(관리자)</tspan></text><rect x="690" y="210" width="230" height="90" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="706" y="236" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="706" dy="0">이슈 작업 로그 탭</tspan></text><text x="706" y="258" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="706" dy="0">한 줄 표 + 상세 모달</tspan><tspan x="706" dy="15.75">변경 이력 탭 · 잠금/인증/통제 배지</tspan></text><defs><marker id="m6x1mp1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M640 130 L690 130" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#m6x1mp1)"/><defs><marker id="me4dgh6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M640 255 L690 255" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#me4dgh6)"/><rect x="970" y="80" width="190" height="220" rx="8" fill="#F4F8F7" stroke="#D9E4E2" stroke-width="1.2"/><text x="986" y="106" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="986" dy="0">보존 기간</tspan></text><text x="986" y="128" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="986" dy="0">일반 12개월</tspan><tspan x="986" dy="15.75">워크포스 연결분 36개월</tspan><tspan x="986" dy="15.75">결재 3년 · 인증 무기한</tspan><tspan x="986" dy="15.75">통제 무기한</tspan><tspan x="986" dy="15.75">(관리자 변경 가능)</tspan></text><rect x="40" y="340" width="1120" height="170" rx="12" fill="#F4F8F7" stroke="#6FD3C6" stroke-width="1.2" stroke-dasharray="6 4"/><text x="56" y="364" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#14756E" text-anchor="start"><tspan x="56" dy="0">만료 처리 — 자동 삭제 없음 (Q132)</tspan></text><rect x="60" y="380" width="250" height="100" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="76" y="406" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="76" dy="0">exportExpiredRecords</tspan></text><text x="76" y="428" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="76" dy="0">만료 범위 엑셀 생성(25건 배치·20초 예산)</tspan></text><rect x="350" y="380" width="250" height="100" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="366" y="406" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="366" dy="0">confirmRecordExport</tspan></text><text x="366" y="428" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="366" dy="0">관리자가 파일 보관 확인 → 범위 확정</tspan></text><rect x="640" y="380" width="250" height="100" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="656" y="406" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="656" dy="0">purgeExportedRecords</tspan></text><text x="656" y="428" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="656" dy="0">확정 범위만 삭제 · remaining 0 까지 반복</tspan></text><rect x="930" y="380" width="210" height="100" rx="8" fill="#FDF3E3" stroke="#E39B2C" stroke-width="1.2"/><text x="946" y="406" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="946" dy="0">예외</tspan></text><text x="946" y="428" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="946" dy="0">설정 변경 365일 · 알림 180일은</tspan><tspan x="946" dy="15.75">스윕이 자동 정리</tspan></text><defs><marker id="m9s66zq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M310 430 L350 430" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#m9s66zq)"/><defs><marker id="manhuul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M600 430 L640 430" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#manhuul)"/><text x="60" y="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#D64545" text-anchor="start"><tspan x="60" dy="0">※ 내보내기는 기록 추출이지 복원 가능한 백업이 아니다. 라이선스 INACTIVE 면 내보내기도 막히므로 해지 전에 내려받는다.</tspan></text></svg>