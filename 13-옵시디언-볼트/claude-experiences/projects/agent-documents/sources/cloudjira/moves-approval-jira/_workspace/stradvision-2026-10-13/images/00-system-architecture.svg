<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#FFFFFF"/><text x="28" y="34" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#10201E">전체 시스템 아키텍처 — 사용자 브라우저부터 저장소·외부 시스템까지 (두 앱 모두 Forge 안에서 실행)</text><rect x="40" y="60" width="1120" height="130" rx="12" fill="#F4F8F7" stroke="#6FD3C6" stroke-width="1.2" stroke-dasharray="6 4"/><text x="56" y="84" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#14756E" text-anchor="start"><tspan x="56" dy="0">① 사용자 브라우저 — Jira 화면 안의 Forge UI (iframe, Custom UI/CRA 멀티 엔트리, Atlaskit)</tspan></text><rect x="60" y="95" width="350" height="80" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="76" y="121" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="76" dy="0">어프로벌</tspan></text><text x="76" y="143" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="76" dy="0">globalPage 업무함 · adminPage 설정 · projectSettingsPage</tspan><tspan x="76" dy="15.75">issueAction Log work · issueActivity 작업 로그 탭 · issuePanel/issueContext 승인</tspan></text><rect x="430" y="95" width="350" height="80" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="446" y="121" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="446" dy="0">워크포스</tspan></text><text x="446" y="143" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="446" dy="0">globalPage(My Work·프로젝트·자원·대시보드·백오피스)</tspan><tspan x="446" dy="15.75">issueActivity/issueContext 워크로그 탭 · customField 6</tspan></text><rect x="800" y="95" width="350" height="80" rx="8" fill="#FDF3E3" stroke="#E39B2C" stroke-width="1.2"/><text x="816" y="121" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="816" dy="0">외부</tspan></text><text x="816" y="143" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="816" dy="0">SAP 배치(월 1회) → OAuth 2.0 3LO 토큰</tspan><tspan x="816" dy="15.75">Jira 모바일 · Automation · REST(API 토큰) = 다른 경로</tspan></text><rect x="40" y="215" width="1120" height="330" rx="12" fill="#F4F8F7" stroke="#6FD3C6" stroke-width="1.2" stroke-dasharray="6 4"/><text x="56" y="239" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#14756E" text-anchor="start"><tspan x="56" dy="0">② Atlassian Forge 플랫폼 — 함수 실행(25초/큐 900초) · 샌드박스 · 스코프 · 라이선스</tspan></text><rect x="60" y="250" width="540" height="280" rx="8" fill="#E9F7F4" stroke="#21ADAD" stroke-width="1.2"/><text x="76" y="276" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="76" dy="0">어프로벌 앱 함수</tspan></text><text x="76" y="298" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="76" dy="0">resolver — guardedDefine + PermissionMap(deny-by-default) + PrincipalResolver</tspan><tspan x="76" dy="15.75">trigger — worklog-changed(생성/수정/삭제) · issue-changed · on-install · preUninstall</tspan><tspan x="76" dy="15.75">workflowValidator(함수형) — 상태 변경 승인 강제</tspan><tspan x="76" dy="15.75">scheduledTrigger approval-sweep(일 1회) → consumer sweep-job(큐 fan-out)</tspan><tspan x="76" dy="15.75">timeTrackingProvider — Jira 기본 Log work 숨김 · 우리 UI 로 대체</tspan><tspan x="76" dy="15.75">queue — 인증 게시(45초 디바운스) · 통제 적용/해제 워커</tspan><tspan x="76" dy="15.75">도메인(순수) — 상태 머신 · 기간 키 · 지문 · 제한선 · 통제 규칙/관문</tspan></text><rect x="620" y="250" width="520" height="280" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="636" y="276" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="636" dy="0">워크포스 앱 함수</tspan></text><text x="636" y="298" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="636" dy="0">resolver — guardedDefine + PermissionMap + ResourceCatalog(권한 세트×리소스)</tspan><tspan x="636" dy="15.75">scheduledTrigger 4 — 마이그레이션 · 포트폴리오 스냅샷 · 구독 스윕 · 삭제 스윕</tspan><tspan x="636" dy="15.75">consumer/큐 6 — 사용자 일괄 등록 · 집계 · 구독 편입</tspan><tspan x="636" dy="15.75">trigger — 설치/업그레이드 · avi:jira:created:issue</tspan><tspan x="636" dy="15.75">integration/approval — 인증 문서 읽기 · 공개키 검증 · 출처 서명 · 능력 신호</tspan><tspan x="636" dy="15.75">core:apiRoute(계획) — 별개 진입점, 가드 직접 구현</tspan><tspan x="636" dy="15.75">도메인 — MD/MM 환산 · 가동률 · 진척 · 원가(인증분 적용)</tspan></text><rect x="40" y="570" width="560" height="150" rx="12" fill="#F4F8F7" stroke="#6FD3C6" stroke-width="1.2" stroke-dasharray="6 4"/><text x="56" y="594" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#14756E" text-anchor="start"><tspan x="56" dy="0">③ 앱 저장소 (Atlassian 호스티드 · 설치당 분리 · 앱 간 공유 불가)</tspan></text><rect x="60" y="605" width="255" height="100" rx="8" fill="#E9F7F4" stroke="#21ADAD" stroke-width="1.2"/><text x="76" y="631" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="76" dy="0">어프로벌 Forge SQL</tspan></text><text x="76" y="653" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="76" dy="0">결재·타임시트·인증·이력·통제·감사</tspan><tspan x="76" dy="15">DDL 29종 · 마이그레이션 v063</tspan><tspan x="76" dy="15">한도 prod 1GiB</tspan></text><rect x="330" y="605" width="255" height="100" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="346" y="631" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="346" dy="0">워크포스 Forge SQL + KVS</tspan></text><text x="346" y="653" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="346" dy="0">users·projectusers·project_team(SQL)</tspan><tspan x="346" dy="15">team·role·holiday·settings(KVS)</tspan><tspan x="346" dy="15">환경 변수: 서명 키(암호화)</tspan></text><rect x="620" y="570" width="540" height="150" rx="12" fill="#F4F8F7" stroke="#6FD3C6" stroke-width="1.2" stroke-dasharray="6 4"/><text x="636" y="594" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#14756E" text-anchor="start"><tspan x="636" dy="0">④ Jira Cloud 데이터 · REST API v3 (asUser 기본 · asApp 은 사유 명시)</tspan></text><rect x="640" y="605" width="245" height="100" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="656" y="631" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="656" dy="0">원본 데이터</tspan></text><text x="656" y="653" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="656" dy="0">워크로그 · 이슈 · 프로젝트 · 사용자</tspan><tspan x="656" dy="15">권한 스킴 · 프로젝트 역할</tspan><tspan x="656" dy="15">워크로그 visibility(역할 제한)</tspan></text><rect x="900" y="605" width="240" height="100" rx="8" fill="#F4F8F7" stroke="#D9E4E2" stroke-width="1.2"/><text x="916" y="631" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="916" dy="0">엔티티 프로퍼티 (교환 채널)</tspan></text><text x="916" y="653" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="916" dy="0">사용자·이슈·프로젝트 프로퍼티</tspan><tspan x="916" dy="15">Ed25519 서명 문서 · 32KB/건</tspan><tspan x="916" dy="15">서명 검증 후에만 신뢰</tspan></text><rect x="40" y="745" width="1120" height="130" rx="12" fill="#F4F8F7" stroke="#6FD3C6" stroke-width="1.2" stroke-dasharray="6 4"/><text x="56" y="769" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#14756E" text-anchor="start"><tspan x="56" dy="0">⑤ 테넌트 밖 (앱이 외부 서버로 보내는 경로 없음 → Runs on Atlassian 배지 유지)</tspan></text><rect x="60" y="780" width="350" height="80" rx="8" fill="#F4F8F7" stroke="#D9E4E2" stroke-width="1.2"/><text x="76" y="806" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="76" dy="0">SAP</tspan></text><text x="76" y="828" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="76" dy="0">api.atlassian.com 게이트웨이 → 워크포스 apiRoute(JSON)</tspan><tspan x="76" dy="15.75">또는 xlsx 수동 전달(1차)</tspan></text><rect x="430" y="780" width="350" height="80" rx="8" fill="#F4F8F7" stroke="#D9E4E2" stroke-width="1.2"/><text x="446" y="806" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="446" dy="0">고객 다운로드 파일</tspan></text><text x="446" y="828" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="446" dy="0">xlsx(워크로그·감사 내보내기) · PDF(증명서)</tspan><tspan x="446" dy="15.75">보관 책임 고객 · 복원 Import 없음</tspan></text><rect x="800" y="780" width="340" height="80" rx="8" fill="#FBE9E9" stroke="#D64545" stroke-width="1.2"/><text x="816" y="806" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="816" dy="0">없음(범위 밖)</tspan></text><text x="816" y="828" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="816" dy="0">메일/Slack/Teams 직접 발송 · 외부 공휴일 API · Outlook</tspan><tspan x="816" dy="15.75">→ egress 추가 = 배지 상실 · 별도 결정</tspan></text><defs><marker id="mqknzij" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M235 175 L235 250" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#mqknzij)"/><rect x="241.2" y="205" width="117.6" height="20" rx="4" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2"/><text x="300" y="219" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="middle"><tspan x="300" dy="0">invoke(resolver)</tspan></text><defs><marker id="mem8lgt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M605 175 L700 250" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#mem8lgt)"/><rect x="664.2" y="205" width="51.599999999999994" height="20" rx="4" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2"/><text x="690" y="219" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="middle"><tspan x="690" dy="0">invoke</tspan></text><defs><marker id="mggces6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E39B2C"/></marker></defs><path d="M975 175 L975 250" fill="none" stroke="#E39B2C" stroke-width="1.6" marker-end="url(#mggces6)"/><rect x="996.2" y="205" width="117.6" height="20" rx="4" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2"/><text x="1055" y="219" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="middle"><tspan x="1055" dy=