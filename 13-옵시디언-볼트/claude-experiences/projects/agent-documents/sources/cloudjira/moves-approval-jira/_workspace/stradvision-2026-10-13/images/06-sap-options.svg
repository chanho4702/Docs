<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="#FFFFFF"/><text x="28" y="34" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#10201E">SAP 연동은 월 1회 — 1차 xlsx 수동 추출, 2차 core:apiRoute(JSON REST, Preview)</text><rect x="40" y="70" width="360" height="190" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><rect x="361" y="80" width="29" height="20" rx="10" fill="#E6F4EC" stroke="#E6F4EC" stroke-width="1.2"/><text x="375.5" y="94" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="600" fill="#2E9E6B" text-anchor="middle"><tspan x="375.5" dy="0">정식</tspan></text><text x="56" y="96" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="56" dy="0">방식 C · 파일 전달 (지금 가능)</tspan></text><text x="56" y="118" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="56" dy="0">워크포스 /worklog-export</tspan><tspan x="56" dy="15.75">이슈키·작성자·accountId·started·초·시간·코멘트</tspan><tspan x="56" dy="15.75">Jira 로그인 사용자가 xlsx 내려받아 SAP 에 적재</tspan><tspan x="56" dy="15.75">배포 영향 없음 · 배지 영향 없음</tspan></text><rect x="420" y="70" width="360" height="190" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><rect x="703.5" y="80" width="66.5" height="20" rx="10" fill="#FDF3E3" stroke="#FDF3E3" stroke-width="1.2"/><text x="736.75" y="94" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="600" fill="#E39B2C" text-anchor="middle"><tspan x="736.75" dy="0">Preview</tspan></text><text x="436" y="96" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="436" dy="0">방식 A · core:apiRoute (권장 2차)</tspan></text><text x="436" y="118" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="436" dy="0">앱이 자체 REST 엔드포인트 선언 → 동적 JSON</tspan><tspan x="436" dy="15.75">Atlassian OAuth 2.0 3LO 토큰으로 호출</tspan><tspan x="436" dy="15.75">관리자가 설치본 단위로 "앱 REST API" 켬</tspan><tspan x="436" dy="15.75">모듈 사용만으로 메이저 버전(실측) · 배지 유지(실측)</tspan><tspan x="436" dy="15.75">커스텀 스코프 환경당 20개 · 삭제 불가</tspan></text><rect x="800" y="70" width="360" height="190" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><rect x="1113.5" y="80" width="36.5" height="20" rx="10" fill="#FBE9E9" stroke="#FBE9E9" stroke-width="1.2"/><text x="1131.75" y="94" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="600" fill="#D64545" text-anchor="middle"><tspan x="1131.75" dy="0">부적합</tspan></text><text x="816" y="96" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="816" dy="0">방식 B · static webtrigger</tspan></text><text x="816" y="118" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="816" dy="0">manifest 에 선언한 고정 응답만 반환</tspan><tspan x="816" dy="15.75">함수 미실행 → 데이터 pull API 불가</tspan><tspan x="816" dy="15.75">동적 응답은 dynamic → Runs on Atlassian 실격</tspan><tspan x="816" dy="15.75">용도: SAP 가 "작업 완료" 를 알리는 수신 신호</tspan></text><rect x="40" y="300" width="1120" height="200" rx="12" fill="#F4F8F7" stroke="#6FD3C6" stroke-width="1.2" stroke-dasharray="6 4"/><text x="56" y="324" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#14756E" text-anchor="start"><tspan x="56" dy="0">방식 A 호출 흐름과 책임 경계</tspan></text><rect x="60" y="340" width="200" height="130" rx="8" fill="#F4F8F7" stroke="#D9E4E2" stroke-width="1.2"/><text x="76" y="366" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="76" dy="0">SAP / 중계 서비스</tspan></text><text x="76" y="388" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="76" dy="0">3LO 동의 → code → 토큰 교환</tspan><tspan x="76" dy="15">refresh token 회전(offline_access)</tspan><tspan x="76" dy="15">만료·재인증 · 서비스 계정</tspan></text><rect x="310" y="340" width="230" height="130" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="326" y="366" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="326" dy="0">Atlassian 게이트웨이</tspan></text><text x="326" y="388" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="326" dy="0">api.atlassian.com/svc/jira/{cloudId}/apps/…</tspan><tspan x="326" dy="15">토큰 없음·잘못된 토큰·미선언 경로 → 401</tspan><tspan x="326" dy="15">우리 함수 실행 전에 차단(실측)</tspan></text><rect x="590" y="340" width="260" height="130" rx="8" fill="#FDF3E3" stroke="#E39B2C" stroke-width="1.2"/><text x="606" y="366" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="606" dy="0">워크포스 apiRoute 핸들러</tspan></text><text x="606" y="388" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="606" dy="0">resolver 가드 전부 우회 → 직접 판정:</tspan><tspan x="606" dy="15">신원 → 권한 → 스코프 → 원가 가시성 → 라이선스</tspan><tspan x="606" dy="15">급여·원가 기본 제외 · 25초 안 페이징</tspan></text><rect x="900" y="340" width="240" height="130" rx="8" fill="#E6F4EC" stroke="#2E9E6B" stroke-width="1.2"/><text x="916" y="366" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="916" dy="0">응답</tspan></text><text x="916" y="388" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="916" dy="0">월별 워크로그·집계(JSON)</tspan><tspan x="916" dy="15">+ 승인/인증 상태 열(어프로벌 프로퍼티)</tspan><tspan x="916" dy="15">OData 는 제품 범위 제외</tspan></text><defs><marker id="mf44zv1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M260 405 L310 405" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#mf44zv1)"/><rect x="259.2" y="375" width="51.599999999999994" height="20" rx="4" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2"/><text x="285" y="389" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="middle"><tspan x="285" dy="0">Bearer</tspan></text><defs><marker id="m88v5k1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M540 405 L590 405" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#m88v5k1)"/><defs><marker id="mowy22f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M850 405 L900 405" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#mowy22f)"/><text x="60" y="492" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#D64545" text-anchor="start"><tspan x="60" dy="0">미검증: 핸들러가 호출자 accountId 를 받는지(3LO 연동 1회 생성으로 확인) — 결과에 따라 기존 권한 모델 재사용 vs 스코프=권한 설계로 갈린다</tspan></text></svg>