<text x="1340.0" y="227.5" dominant-baseline="central" text-anchor="middle" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="16" font-weight="400" fill="#526777">1000 ms</text>
<text x="56" y="287.0" dominant-baseline="central" text-anchor="start" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="700" fill="#142C3D">주문 API · SERVER</text>
<text x="56" y="315.5" dominant-baseline="central" text-anchor="start" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="15" font-weight="400" fill="#526777">order-api</text>
<rect x="420.0" y="280" width="920.0" height="31" rx="7" fill="#2563B5" stroke="#2563B5" stroke-width="1.5"/>
<text x="430.0" y="295.5" dominant-baseline="central" text-anchor="start" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">1000 ms</text>
<text x="56" y="357.0" dominant-baseline="central" text-anchor="start" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="700" fill="#142C3D">DB 조회 · CLIENT</text>
<text x="56" y="385.5" dominant-baseline="central" text-anchor="start" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="15" font-weight="400" fill="#526777">order-api</text>
