<text x="733.6" y="435.5" dominant-baseline="central" text-anchor="start" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">550 ms</text>
<text x="56" y="497.0" dominant-baseline="central" text-anchor="start" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="700" fill="#142C3D">결제 처리 · SERVER</text>
<text x="56" y="525.5" dominant-baseline="central" text-anchor="start" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="15" font-weight="400" fill="#526777">payment-api</text>
<rect x="742.0" y="490" width="460.0" height="31" rx="7" fill="#7257AC" stroke="#7257AC" stroke-width="1.5"/>
<text x="752.0" y="505.5" dominant-baseline="central" text-anchor="start" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">500 ms</text>
<text x="56" y="567.0" dominant-baseline="central" text-anchor="start" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="700" fill="#142C3D">DB 저장 · CLIENT</text>
<text x="56" y="595.5" dominant-baseline="central" text-anchor="start" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="15" font-weight="400" fill="#526777">order-api</text>
<rect x="1248.0" y="560" width="55.2" height="31" rx="7" fill="#087F82" stroke="#087F82" stroke-width="1.5"/>
<text x="1238.0" y="575.5" dominant-baseline="central" text-anchor="end" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="700" fill="#087F82">60 ms</text>
<rect x="56" y="654" width="1328" height="137" rx="14" fill="#FFF8EB" stroke="#E7D6B4" stroke-width="1.5"/>
<text x="82" y="688.5" dominant-baseline="central" text-anchor="start" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700" fill="#AA6410">겹치는 구간의 시간을 모두 더하지 않는다</text>
<text x="82" y="731.0" dominant-baseline="central" text-anchor="start" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400" fill="#142C3D">클라이언트 호출 550ms 안에 서버 처리 500ms가 포함된다. 전체 요청은 1,000ms다.</text>
<text x="82" y="764.0" dominant-baseline="central" text-anchor="start" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="18" font-weight="400" fill="#526777">Span의 시간 관계와 속성을 바탕으로 추가로 조사할 구간을 좁힌다.</text>
