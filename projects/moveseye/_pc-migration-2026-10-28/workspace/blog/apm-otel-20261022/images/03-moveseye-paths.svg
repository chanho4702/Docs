<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1090" viewBox="0 0 1440 1090" role="img" aria-labelledby="title desc">
<title id="title">MovesEye는 관측 목적에 따라 데이터 경로를 나눈다</title><desc id="desc">MovesEye는 관측 목적에 따라 데이터 경로를 나눈다; 서버 측 주요 경로의 개념도  /  라이브 기능·Java 확장을 활성화한 구성; MOVESEYE  /  ENGINEERING NOTES; 직접 제작한 설명 도식; 애플리케이션에서 생성; Collector에서 처리; MovesEye에서 활용; 일반 메트릭; 요청 수 · 지연 분포; JVM 등 런타임 지표; 메트릭 파이프라인; 허용목록 · 배치; 저장형 큐 · 재시도; 집계 · PostgreSQL; 조회 API → 지표와 추세 화면; 완료된 Span; HTTP · DB · 외부 호출; Trace의 구성 구간; 보존용 Trace; 오류 · 지연 · 확률 정책; Tail sampling → 저장형 큐; Trace 저장 · PostgreSQL; 조회 API → 요청 상세 분석; 완료된 Span; 위와 같은 Trace 입력; 별도 라이브 분기; 라이브 완료 Span; HTTP 서버 Span · 속성 축소; Tail sampling 없음 · 재시도 끔; 최근 기록 · 메모리 링 버퍼; 집계 · 표시 표본 → SSE → 실시간 화면; Java Agent 확장; 진행 중 요청의 건수; 경과 시간 · 오래된 요청 목록; 메트릭 + 특수 로그; 집계와 상세 목록 분리; 각 신호의 수집 경로 이용; 진행 중 요청 · 메모리 상태; 조회·실시간 집계 → 현재 요청 상태; 라이브 표시 ≠ 상세 Trace 보존  ·  진행 중 요청 ≠ 완료 Span  ·  모든 경로에 수집 범위와 상한이 있다.</desc>
