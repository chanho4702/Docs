<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#FFFFFF"/><text x="28" y="34" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#10201E">인증된 시간의 원본은 어프로벌 DB — Jira 에서 바뀌어도 인증값은 바뀌지 않는다</text><rect x="40" y="80" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="56" y="106" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="56" dy="0">팀장 인증(certifyWorklogs)</tspan></text><text x="56" y="128" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="56" dy="0">상위자 인증 원칙 · PIN 묶음당 1회</tspan><tspan x="56" dy="15.75">상위자 없는 팀장만 본인 인증(self_certified)</tspan><tspan x="56" dy="15.75">팀원 본인 인증 거부</tspan></text><rect x="340" y="80" width="250" height="110" rx="8" fill="#E9F7F4" stroke="#21ADAD" stroke-width="1.2"/><text x="356" y="106" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="356" dy="0">worklog_cert (현재 인증본)</tspan></text><text x="356" y="128" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="356" dy="0">이슈·작성자·시작·초 → 지문 고정</tspan><tspan x="356" dy="15.75">worklog_cert_batch(누가·누구·월·PIN)</tspan><tspan x="356" dy="15.75">worklog_cert_log(재인증 전 판 보관)</tspan></text><rect x="640" y="80" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="656" y="106" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="656" dy="0">게시 큐 (45초 디바운스)</tspan></text><text x="656" y="128" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="656" dy="0">인증 직후 이벤트 기반 게시</tspan><tspan x="656" dy="15.75">일일 스윕이 누락 보정</tspan><tspan x="656" dy="15.75">인증 없는 날 비용 0</tspan></text><rect x="940" y="80" width="220" height="110" rx="8" fill="#F4F8F7" stroke="#D9E4E2" stroke-width="1.2"/><text x="956" y="106" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="956" dy="0">사용자 프로퍼티</tspan></text><text x="956" y="128" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="956" dy="0">movesApproval.cert.{YYYY-MM}</tspan><tspan x="956" dy="15.75">typ approval.cert v2</tspan><tspan x="956" dy="15.75">kid · iat · sig(Ed25519)</tspan></text><defs><marker id="mry1xez" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M290 135 L340 135" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#mry1xez)"/><defs><marker id="mummjbx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M590 135 L640 135" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#mummjbx)"/><defs><marker id="mbxcnur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M890 135 L940 135" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#mbxcnur)"/><rect x="40" y="240" width="540" height="120" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="56" y="266" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="56" dy="0">문서 본문(30,000B 예산)</tspan></text><text x="56" y="288" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="56" dy="0">cs 인증 합계(원가의 단일 입력) · cn/mn/dn 건수 · sc/sn 본인 서명분</tspan><tspan x="56" dy="15.75">w [worklogId, 초, flag] 최대 1,000건 — 초과 시 잘림 wt=true</tspan><tspan x="56" dy="15.75">di 삭제된 건의 원래 이슈(원가 유지 옵션용)</tspan></text><defs><marker id="mstmkkw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6FD3C6"/></marker></defs><path d="M1050 190 L1050 240 L580 300" fill="none" stroke="#6FD3C6" stroke-width="1.6" marker-end="url(#mstmkkw)"/><rect x="640" y="240" width="520" height="120" rx="8" fill="#FDF3E3" stroke="#E39B2C" stroke-width="1.2"/><text x="656" y="266" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="656" dy="0">Jira 에서 이후에 바뀌면</tspan></text><text x="656" y="288" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="656" dy="0">수정 → MISMATCH 표시(인증 시간 유지) · 삭제 → DELETED</tspan><tspan x="656" dy="15.75">deletedCertifiedHandling = KEEP(기본) | ZERO</tspan><tspan x="656" dy="15.75">다른 경로 입력(FLAG)은 인증을 막지 않는다 — 인증자가 판단</tspan></text><rect x="40" y="400" width="1120" height="140" rx="12" fill="#F4F8F7" stroke="#6FD3C6" stroke-width="1.2" stroke-dasharray="6 4"/><text x="56" y="424" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#14756E" text-anchor="start"><tspan x="56" dy="0">워크포스 (moves-workforce · RFC-220)</tspan></text><rect x="60" y="440" width="340" height="80" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="76" y="466" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="76" dy="0">asApp 읽기 → 공개키 검증(keyring)</tspan></text><text x="76" y="488" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="76" dy="0">서명 실패 = 문서 없음으로 처리 · 원문 미노출</tspan></text><rect x="430" y="440" width="340" height="80" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="446" y="466" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="446" dy="0">원가 계산(certifyCostRows)</tspan></text><text x="446" y="488" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="446" dy="0">문서 있는 사용자×월: 인증 시간 적용</tspan><tspan x="446" dy="15.75">문서 없는 범위: 기존 계산(legacySeconds)</tspan></text><rect x="800" y="440" width="340" height="80" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="816" y="466" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="816" dy="0">화면</tspan></text><text x="816" y="488" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="816" dy="0">확정 원가(인증분) / 예상 원가(미인증 포함) 나란히</tspan><tspan x="816" dy="15.75">현황은 전부 표시 + 주장/인증 배지</tspan></text><defs><marker id="mzsdj4v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M400 480 L430 480" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#mzsdj4v)"/><defs><marker id="mlnv6vu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M770 480 L800 480" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#mlnv6vu)"/><defs><marker id="mzushpg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6FD3C6"/></marker></defs><path d="M1050 190 L1150 190 L1150 410" fill="none" stroke="#6FD3C6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mzushpg)"/></svg>