<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#FFFFFF"/><text x="28" y="34" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#10201E">두 앱은 Jira 엔티티 프로퍼티로만 대화하고, 잠금·승인·이력은 어프로벌이 쥔다</text><rect x="40" y="70" width="520" height="70" rx="8" fill="#F4F8F7" stroke="#D9E4E2" stroke-width="1.2"/><text x="56" y="96" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="56" dy="0">작성자 · 팀장 · 관리자</tspan></text><text x="56" y="118" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="56" dy="0">Jira 이슈 화면(Log work 대체 UI) · 워크포스 워크로그 탭 · 승인 업무함 · 설정</tspan></text><rect x="900" y="70" width="260" height="70" rx="8" fill="#F4F8F7" stroke="#D9E4E2" stroke-width="1.2"/><text x="916" y="96" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="916" dy="0">SAP (외부)</tspan></text><text x="916" y="118" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="916" dy="0">월 1회 · Atlassian OAuth 2.0 3LO(계획)</tspan></text><rect x="40" y="190" width="540" height="250" rx="8" fill="#E9F7F4" stroke="#21ADAD" stroke-width="2"/><rect x="496" y="200" width="74" height="20" rx="10" fill="#14756E" stroke="#14756E" stroke-width="1.2"/><text x="533" y="214" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan x="533" dy="0">잠금·승인·이력</tspan></text><text x="56" y="216" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="56" dy="0">어프로벌 앱  moves-approval-jira</tspan></text><text x="56" y="238" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="56" dy="0">타임시트 제출 → 팀장 1단계 승인 · 팀 일괄 승인(50건/PIN 1회)</tspan><tspan x="56" dy="17.25">기간 잠금 · 워크로그 통제(수정·삭제 판정 후 asApp 실행) · 인증(RFC-220)</tspan><tspan x="56" dy="17.25">워크로그 변경 이력 · 결재/인증/통제/설정 감사 · 증명서 PDF</tspan><tspan x="56" dy="17.25">jira:timeTrackingProvider 로 Jira 기본 Log work 를 우리 화면으로 대체</tspan><tspan x="56" dy="17.25">저장소: Forge SQL(운영 1GiB) · 마이그레이션 v063</tspan></text><rect x="620" y="190" width="540" height="250" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><rect x="1046" y="200" width="104" height="20" rx="10" fill="#E9F7F4" stroke="#E9F7F4" stroke-width="1.2"/><text x="1098" y="214" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="600" fill="#14756E" text-anchor="middle"><tspan x="1098" dy="0">인력·계획·원가·API</tspan></text><text x="636" y="216" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="636" dy="0">워크포스 앱  moves-workforce</tspan></text><text x="636" y="238" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="636" dy="0">팀 · 팀장 · 프로젝트 인력 배정 · 계획 · 가동률 · 간트</tspan><tspan x="636" dy="17.25">원가·정산: 인증 문서 범위에 인증 시간 적용(없는 범위는 기존 계산)</tspan><tspan x="636" dy="17.25">현황은 전부 표시 + 주장/인증 배지</tspan><tspan x="636" dy="17.25">외부 API(core:apiRoute, 계획) · 엑셀 사용자 업로드 · 워크로그 xlsx 추출</tspan><tspan x="636" dy="17.25">저장소: Forge SQL + KVS · 연동으로 새 테이블 없음(DB 무증가)</tspan></text><rect x="40" y="500" width="1120" height="190" rx="12" fill="#F4F8F7" stroke="#6FD3C6" stroke-width="1.2" stroke-dasharray="6 4"/><text x="56" y="524" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#14756E" text-anchor="start"><tspan x="56" dy="0">Jira Cloud (고객 테넌트)</tspan></text><rect x="60" y="540" width="330" height="130" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="76" y="566" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="76" dy="0">워크로그 원본</tspan></text><text x="76" y="588" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="76" dy="0">시간·일자·이슈·설명. 앱을 지워도 남는다</tspan><tspan x="76" dy="16.5">권한 스킴: Work on work items</tspan></text><rect x="410" y="540" width="400" height="130" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="426" y="566" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="426" dy="0">엔티티 프로퍼티 = 앱 간 유일한 교환 채널</tspan></text><text x="426" y="588" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="426" dy="0">사용자: movesApproval.{YYYY} · .cert.{YYYY-MM} · movesRms.org</tspan><tspan x="426" dy="16.5">이슈·프로젝트: movesApproval.ctl · rms.policy</tspan><tspan x="426" dy="16.5">Ed25519 서명 — 위조 방지(기밀성 아님), cloudId·엔티티 id 포함</tspan></text><rect x="830" y="540" width="310" height="130" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="846" y="566" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="846" dy="0">이벤트 · 권한</tspan></text><text x="846" y="588" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="846" dy="0">avi:jira:{created,updated,deleted}:worklog</tspan><tspan x="846" dy="16.5">avi:jira:updated:issue · 설치/제거 트리거</tspan><tspan x="846" dy="16.5">워크로그 visibility(역할 제한)</tspan></text><defs><marker id="m6lbq7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M200 140 L200 190" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#m6lbq7a)"/><rect x="247.6" y="155" width="64.8" height="20" rx="4" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2"/><text x="280" y="169" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="middle"><tspan x="280" dy="0">제출·승인·입력</tspan></text><defs><marker id="m1apzd9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M480 140 L480 190" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#m1apzd9)"/><defs><marker id="m1d7jkf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M760 140 L760 190" fill="none" stroke="#1A9A90" stroke-width="1.6" marker-end="url(#m1d7jkf)"/><rect x="817.7" y="155" width="84.6" height="20" rx="4" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2"/><text x="860" y="169" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="middle"><tspan x="860" dy="0">워크로그 탭·팀 설정</tspan></text><defs><marker id="mlu0gux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A9A90"/></marker></defs><path d="M1030 140 L1030 190" fill="none" stroke="#1A9A90" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mlu0gux)"/><rect x="1064.2" y="155" width="51.599999999999994" height="20" rx="4" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2"/><text x="1090" y="169" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="middle"><tspan x="1090" dy="0">3LO 토큰</tspan></text><defs><marker id="mt5grwo" 