<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#FFFFFF"/><text x="28" y="34" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#10201E">원본은 Jira 에, 앱 데이터는 Atlassian 인프라 안에 — 테넌트 밖으로 나가는 경로는 다운로드와 SAP 뿐</text><rect x="40" y="70" width="1120" height="360" rx="12" fill="#F4F8F7" stroke="#6FD3C6" stroke-width="1.2" stroke-dasharray="6 4"/><text x="56" y="94" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#14756E" text-anchor="start"><tspan x="56" dy="0">Atlassian 인프라 (Runs on Atlassian — 외부 egress 없음)</tspan></text><rect x="60" y="110" width="340" height="300" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="76" y="136" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="76" dy="0">Jira Cloud (원본)</tspan></text><text x="76" y="158" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="76" dy="0">워크로그 시간·일자·이슈·설명</tspan><tspan x="76" dy="15.75">권한 스킴 · 사용자 · 프로젝트</tspan><tspan x="76" dy="15.75"></tspan><tspan x="76" dy="15.75">엔티티 프로퍼티(교환물)</tspan><tspan x="76" dy="15.75">  movesApproval.{YYYY} 결재 요약</tspan><tspan x="76" dy="15.75">  movesApproval.cert.{YYYY-MM} 인증 문서</tspan><tspan x="76" dy="15.75">  movesRms.org · rms.policy · movesApproval.ctl</tspan><tspan x="76" dy="15.75">  → 편집 권한자 누구나 쓸 수 있어 서명 검증 후에만 신뢰</tspan><tspan x="76" dy="15.75">  → 읽기 범위는 Jira 엔티티 열람 권한(기밀성 없음)</tspan></text><rect x="430" y="110" width="350" height="300" rx="8" fill="#E9F7F4" stroke="#21ADAD" stroke-width="1.2"/><text x="446" y="136" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="446" dy="0">어프로벌 Forge SQL (설치당)</tspan></text><text x="446" y="158" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="446" dy="0">approval_request/approver/event — 결재(3년)</tspan><tspan x="446" dy="15.75">timesheet_* · period_close/reopen — 기간</tspan><tspan x="446" dy="15.75">worklog_cert* — 인증(무기한)</tspan><tspan x="446" dy="15.75">worklog_mirror/history — 변경 이력(12/36개월)</tspan><tspan x="446" dy="15.75">worklog_control/_log — 통제(무기한)</tspan><tspan x="446" dy="15.75">approval_settings_audit — 설정(365일)</tspan><tspan x="446" dy="15.75">approval_notification — 알림(180일)</tspan><tspan x="446" dy="15.75"></tspan><tspan x="446" dy="15.75">한도 prod 1GiB · stg 256MiB · dev 128MiB</tspan></text><rect x="810" y="110" width="330" height="300" rx="8" fill="#FFFFFF" stroke="#D9E4E2" stroke-width="1.2"/><text x="826" y="136" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="826" dy="0">워크포스 Forge SQL + KVS</tspan></text><text x="826" y="158" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="826" dy="0">users · projectusers · project_team</tspan><tspan x="826" dy="15.75">team · role · level · holiday(KVS)</tspan><tspan x="826" dy="15.75">급여 정책 · 계획 · 스냅샷</tspan><tspan x="826" dy="15.75"></tspan><tspan x="826" dy="15.75">연동으로 새 테이블 없음(DB 무증가)</tspan><tspan x="826" dy="15.75">인증 문서는 읽어서 계산에만 사용</tspan><tspan x="826" dy="15.75"></tspan><tspan x="826" dy="15.75">Forge 환경 변수: 연동 서명 개인키</tspan><tspan x="826" dy="15.75">(forge variables set --encrypt)</tspan></text><rect x="60" y="470" width="340" height="100" rx="8" fill="#F4F8F7" stroke="#D9E4E2" stroke-width="1.2"/><text x="76" y="496" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="76" dy="0">사용자 다운로드 (고객 책임)</tspan></text><text x="76" y="518" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="76" dy="0">xlsx: 워크로그 추출 · 감사 내보내기</tspan><tspan x="76" dy="15.75">PDF: 증명서</tspan><tspan x="76" dy="15.75">보관 책임은 고객 · 앱 통제 밖</tspan></text><rect x="430" y="470" width="350" height="100" rx="8" fill="#F4F8F7" stroke="#D9E4E2" stroke-width="1.2"/><text x="446" y="496" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="446" dy="0">SAP (고객이 켜는 스위치)</tspan></text><text x="446" y="518" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="446" dy="0">관리자 "앱 REST API" 활성화 후에만</tspan><tspan x="446" dy="15.75">3LO 토큰 · 조직 구성원 누구나 연동 생성 가능</tspan><tspan x="446" dy="15.75">응답 범위 축소는 우리 코드 책임</tspan></text><rect x="810" y="470" width="330" height="100" rx="8" fill="#FDF3E3" stroke="#E39B2C" stroke-width="1.2"/><text x="826" y="496" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#10201E" text-anchor="start"><tspan x="826" dy="0">미확인 · 결정 필요</tspan></text><text x="826" y="518" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#55625F" text-anchor="start"><tspan x="826" dy="0">레지던시: 플랫폼 지원(문서), 리전·PINNED 미확인</tspan><tspan x="826" dy="15.75">감사 계정 id 보존 정책 — 법무·Marketplace 확인</tspan><tspan x="826" dy="15.75">제거 후 저장소는 soft delete → 영구 삭제</tspan></text><defs><marker id="me6nf85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A9896"/></marker></defs><path d="M230 410 L230 470" fill="none" stroke="#8A9896" stroke-width="1.6" marker-end="url(#me6nf85)"/><defs><marker id="mfwy2jw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A9896"/></marker></defs><path d="M600 410 L600 470" fill="none" stroke="#8A9896" stroke-width="1.6" marker-end="url(#mfwy2jw)"/></svg>