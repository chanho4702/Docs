<!doctype html><html lang="ko"><meta charset="utf-8"><title>AppShell visual check</title><style>:root{--ds-surface:#fff;--ds-text:#172b4d;--ds-border:#dfe1e6}body{font-family:Segoe UI,Malgun Gothic,sans-serif;background:var(--ds-surface,#fff);color:var(--ds-text,#172b4d)}html, body, #root { margin: 0; padding: 0; min-height: 100%; }
.app-page { display: flex; align-items: flex-start; gap: 24px; padding: 12px 0 24px; }
.app-sidebar {
  position: sticky; top: 12px; width: 240px; flex: 0 0 240px;
  border-right: 1px solid var(--ds-border, #dfe1e6); padding-right: 12px;
  box-sizing: border-box; color: var(--ds-text, #172b4d); max-height: 720px; overflow-y: auto;
}
.app-sidebar-head { display: flex; align-items: center; gap: 8px; padding: 4px 0 12px; }
.app-sidebar-title { font-weight: 600; flex: 1; min-width: 0; }
.app-nav-toggle { border: 0; border-radius: 4px; background: transparent; color: var(--ds-text-subtle, #44546f); cursor: pointer; font: inherit; font-size: 22px; width: 32px; height: 32px; flex-shrink: 0; }
.app-nav-group + .app-nav-group { border-top: 1px solid var(--ds-border, #dfe1e6); margin-top: 12px; padding-top: 12px; }
.app-nav-group-label { font-size: 11px; color: var(--ds-text-subtlest, #626f86); padding: 4px 10px 8px; }
.app-nav-item { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--ds-text, #172b4d); cursor: pointer; text-align: left; font: inherit; font-size: 14px; }
.app-nav-item:hover, .app-nav-toggle:hover { background: var(--ds-background-neutral-subtle-hovered, #f1f2f4); }
.app-nav-item--selected, .app-nav-item--selected:hover { background: var(--ds-background-selected, #e9f2ff); color: var(--ds-text-selected, #0c66e4); }
.app-nav-item:focus-visible, .app-nav-toggle:focus-visible { outline: 2px solid var(--ds-border-focused, #388bff); outline-offset: -2px; }
.app-nav-icon { display: inline-flex; align-items: center; justify-content: center; width: 20px; flex: 0 0 20px; }
.app-nav-initial { font-size: 12px; font-weight: 600; }
.app-nav-label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.app-nav-badge { display: inline-flex; font-size: 12px; }
.app-nav-children { margin-left: 12px; border-left: 1px solid var(--ds-border, #dfe1e6); padding-left: 4px; }
.app-nav-child { min-height: 34px; font-size: 13px; }
.app-nav-child .app-nav-icon { display: none; }
.app-nav-tooltip { display: none; }
.app-main { flex: 1; min-width: 0; }
.app-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 4px 0 16px; flex-wrap: wrap; }
.app-title { margin: 0; font-size: 20px; font-weight: 600; color: var(--ds-text, #172b4d); }
.app-heading-group { min-width: 0; }
.app-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.app-card { padding: 0; }
.app-page--collapsed .app-sidebar { width: 56px; flex-basis: 56px; padding-right: 4px; }
.app-page--collapsed .app-sidebar-title, .app-page--collapsed .app-nav-label, .app-page--collapsed .app-nav-group-label { display: none; }
.app-page--collapsed .app-nav-item { justify-content: center; padding: 10px 6px; }
.app-page--collapsed .app-nav-badge { position: absolute; right: 0; top: 0; }
.app-page--collapsed .app-nav-children { margin: 0; padding: 0; border: 0; }
.app-page--collapsed .app-nav-child .app-nav-icon { display: inline-flex; }
.app-page--collapsed .app-nav-item:hover .app-nav-tooltip, .app-page--collapsed .app-nav-item:focus-visible .app-nav-tooltip { display: block; position: absolute; top: 100%; left: 0; width: 48px; padding: 3px 0; font-size: 10px; overflow-wrap: anywhere; z-index: 2; background: var(--ds-surface-overlay, #fff); color: var(--ds-text, #172b4d); }
@media (max-width: 760px) {
  .app-page { gap: 12px; }
}

/* layout:blank가 viewport를 고정한 globalPage만 높이를 채운다. 자동 높이 iframe에는 적용하지 않는다. */
.app-page--full {
  height: 100vh;
  min-height: 0;
  width: 100%;
  align-items: stretch;
  gap: 0;
  padding: 0;
  overflow: hidden;
}
.app-page--full .app-sidebar {
  position: relative;
  top: 0;
  height: 100%;
  min-height: 0;
  max-height: none;
  padding-right: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--ds-surface, #fff);
}
.app-page--full .app-sidebar-head {
  flex: 0 0 auto;
  min-height: 64px;
  padding: 12px;
  box-sizing: border-box;
  border-bottom: 1px solid var(--ds-border, #dfe1e6);
}
.app-page--full .app-sidebar nav {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 8px 4px;
}
.app-page--full .app-main {
  height: 100%;
  min-height: 0;
  box-sizing: border-box;
  overflow: auto;
  padding: 24px;
}
.app-page--full.app-page--collapsed .app-sidebar-head { justify-content: center; padding: 12px 4px; }
html[data-color-mode="dark"] .app-page--full .app-sidebar {
  background: var(--ds-surface-raised, #242528);
  border-right-color: var(--ds-border-bold, #7e8188);
}
